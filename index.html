
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8aa88a">
  <title>CasaLinda</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --text: #2e2e2e;
      --muted: #777;
      --green: #8aa88a;
      --green-dark: #6f8f70;
      --green-soft: #e8f0e6;
      --pink: #d7a9a3;
      --border: #ddd8d0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      margin-bottom: 16px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin: 4px 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .routine-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .time {
      color: var(--muted);
      font-size: 14px;
    }

    .progress-wrap {
      margin-top: 14px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .progress {
      height: 12px;
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width .3s;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .task:last-child {
      border-bottom: 0;
    }

    input[type="checkbox"] {
      width: 25px;
      height: 25px;
      accent-color: var(--green-dark);
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 16px;
      line-height: 1.35;
    }

    .task.done .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .task-time {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .timer {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      margin: 10px 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 13px 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: var(--green-dark);
      color: white;
    }

    .secondary {
      background: var(--green-soft);
      color: var(--text);
    }

    .reset {
      background: #f4e3e0;
      color: #704c48;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: var(--green-soft);
      border-radius: 14px;
      padding: 13px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 8px 0 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">🏡 Casa Boretto</div>
    <div class="subtitle">La mia routine di casa</div>
  </div>

  <div class="card">
    <div class="routine-title">✨ Pulizia quotidiana</div>
[09/09, 14:02] ChatGpt: <div class="time">Tempo previsto: circa 45 minuti</div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span>Avanzamento</span>
        <span id="progressText">0 / 10</span>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <div class="card" id="taskList">

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🛏️ Rifare i letti e arieggiare le camere
        <div class="task-time">5 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🧺 Avviare la lavatrice del giorno
        <div class="task-time">3 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        👕 Ritirare il bucato asciutto, piegarlo e metterlo subito a posto
        <div class="task-time">7 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🍽️ Sistemare cucina, lavello e piano di lavoro
        <div class="task-time">7 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🛋️ Reset veloce del soggiorno
        <div class="task-time">4 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🚽 Reset veloce dei bagni
        <div class="task-time">5 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🧹 Raccogliere briciole, capelli e sporco visibile dai pavimenti
        <div class="task-time">5 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🧴 Rimettere al loro posto gli oggetti fuori posto
        <div class="task-time">4 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🐶 Sistemare la zona di Moki
        <div class="task-time">3 minuti</div>
      </div>
    </label>

    <label class="task">
      <input type="checkbox">
      <div class="task-text">
        🌙 Reset finale della casa
        <div class="task-time">2 minuti</div>
      </div>
    </label>

  </div>

  <div class="card">
    <div class="routine-title">⏱️ Sfida contro il tempo</div>

    <div class="timer" id="timer">00:00</div>

    <div class="buttons">
      <button class="primary" id="startButton">▶ Avvia</button>
      <button class="secondary" id="pauseButton">⏸ Pausa</button>
      <button class="secondary" id="finishButton">✓ Fine routine</button>
      <button class="reset" id="resetButton">↻ Reset giornaliero</button>
    </div>
  </div>

  <div class="card">
    <div class="routine-title">📊 Oggi</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="completedStat">0</div>
        <div class="stat-label">Task completate</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="actualTime">—</div>
        <div class="stat-label">Tempo effettivo</div>
      </div>
    </div>
  </div>

  <div class="footer-note">
    Un passo alla volta 🌿
  </div>

</div>

<script>
  const checkboxes = [...document.querySelectorAll('input[type="checkbox"]')];
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const completedStat = document.getElementById('completedStat');
  const timerDisplay = document.getElementById('timer');
  const actualTime = document.getElementById('actualTime');
[09/09, 14:02] ChatGpt: let seconds = 0;
  let timerInterval = null;

  function updateProgress() {
    const completed = checkboxes.filter(c => c.checked).length;
    const total = checkboxes.length;
    const percent = (completed / total) * 100;

    progressBar.style.width = percent + '%';
    progressText.textContent = completed + ' / ' + total;
    completedStat.textContent = completed;

    checkboxes.forEach(c => {
      c.closest('.task').classList.toggle('done', c.checked);
    });

    saveState();
  }

  function formatTime(value) {
    const minutes = Math.floor(value / 60);
    const secs = value % 60;

    return String(minutes).padStart(2,'0') + ':' +
           String(secs).padStart(2,'0');
  }

  function updateTimer() {
    timerDisplay.textContent = formatTime(seconds);
  }

  function saveState() {
    localStorage.setItem(
      'casaBorettoTasks',
      JSON.stringify(checkboxes.map(c => c.checked))
    );

    localStorage.setItem('casaBorettoSeconds', seconds);
    localStorage.setItem('casaBorettoDate', new Date().toDateString());
  }

  function loadState() {
    const savedDate = localStorage.getItem('casaBorettoDate');
    const today = new Date().toDateString();

    if (savedDate && savedDate !== today) {
      localStorage.removeItem('casaBorettoTasks');
      localStorage.removeItem('casaBorettoSeconds');
      localStorage.removeItem('casaBorettoActualTime');
    }

    const savedTasks = JSON.parse(
      localStorage.getItem('casaBorettoTasks') || '[]'
    );

    savedTasks.forEach((value, index) => {
      if (checkboxes[index]) checkboxes[index].checked = value;
    });

    seconds = Number(localStorage.getItem('casaBorettoSeconds')) || 0;

    const savedActual = localStorage.getItem('casaBorettoActualTime');

    if (savedActual) {
      actualTime.textContent = savedActual;
    }

    updateTimer();
    updateProgress();
  }

  checkboxes.forEach(c => {
    c.addEventListener('change', updateProgress);
  });

  document.getElementById('startButton').addEventListener('click', () => {
    if (timerInterval) return;

    timerInterval = setInterval(() => {
      seconds++;
      updateTimer();
      saveState();
    }, 1000);
  });

  document.getElementById('pauseButton').addEventListener('click', () => {
    clearInterval(timerInterval);
    timerInterval = null;
    saveState();
  });

  document.getElementById('finishButton').addEventListener('click', () => {
    clearInterval(timerInterval);
    timerInterval = null;

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;
    const result = minutes + 'm ' + secs + 's';

    actualTime.textContent = result;
    localStorage.setItem('casaBorettoActualTime', result);
    saveState();
  });

  document.getElementById('resetButton').addEventListener('click', () => {
    clearInterval(timerInterval);
    timerInterval = null;

    checkboxes.forEach(c => c.checked = false);
    seconds = 0;

    actualTime.textContent = '—';

    localStorage.removeItem('casaBorettoTasks');
    localStorage.removeItem('casaBorettoSeconds');
    localStorage.removeItem('casaBorettoActualTime');

    localStorage.setItem('casaBorettoDate', new Date().toDateString());

    updateTimer();
    updateProgress();
  });

  loadState();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
